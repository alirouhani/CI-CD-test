name: C++ CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ] # This tells GitHub to watch for version tags
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------
  # CI JOB: Builds, Checks Memory (ASan), and Tests
  # ---------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="--coverage -fsanitize=address" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

    - name: Build Project
      run: cmake --build build

    - name: Run Unit Tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Generate Coverage Report
      run: |
        lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps/*' --output-file coverage.info --ignore-errors mismatch
        lcov --list coverage.info

  # ---------------------------------------------------------
  # CD JOB: Packages the algorithm and creates a GitHub Release
  # ---------------------------------------------------------
  deploy:
    needs: build-and-test              # CD only starts if CI passes
    if: startsWith(github.ref, 'refs/tags/') # Only run if a tag was pushed
    runs-on: ubuntu-latest
    permissions:
      contents: write                  # Allows the bot to upload files to "Releases"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Optimized Library
      # For CD, we build in 'Release' mode (high performance, no debug info)
      run: |
        cmake -S . -B build_release -DCMAKE_BUILD_TYPE=Release
        cmake --build build_release

    - name: Package Release
      # We gather the .h files and the compiled library into a .tar.gz
      run: |
        mkdir -p dist/include
        cp include/*.h dist/include/
        cp build_release/*.a dist/ 2>/dev/null || cp build_release/*.lib dist/ 
        tar -czvf binary_search_release.tar.gz -C dist .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: binary_search_release.tar.gz
        name: Release ${{ github.ref_name }}
        body: |
          ### Automated Algorithm Release
          - **Version:** ${{ github.ref_name }}
          - **Status:** Verified by CI (ASan + GoogleTest)
          - **Performance:** Built with `-O3` (Release mode)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
