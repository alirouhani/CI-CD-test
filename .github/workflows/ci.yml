name: C++ CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ] 
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------
  # CI JOB: Builds, Checks Memory (ASan), and Tests
  # ---------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="--coverage -fsanitize=address" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

    - name: Build Project
      run: cmake --build build

    - name: Run Unit Tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Generate Coverage Report
      run: |
        lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps/*' --output-file coverage.info --ignore-errors mismatch
        lcov --list coverage.info

  # ---------------------------------------------------------
  # CD JOB: Multi-OS Packaging and Release
  # ---------------------------------------------------------
  deploy:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Optimized Library
      run: |
        cmake -S . -B build_release -DCMAKE_BUILD_TYPE=Release
        cmake --build build_release

    - name: Package Release
      shell: bash
      run: |
        mkdir -p dist/include
        cp include/*.h dist/include/
        # This find command handles both .a (Unix) and .lib (Windows) files
        find build_release -name "*.a" -exec cp {} dist/ \; || true
        find build_release -name "*.lib" -exec cp {} dist/ \; || true
        # Create a compressed archive named after the OS
        tar -czvf binary_search_${{ matrix.os }}.tar.gz -C dist .

    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: binary_search_${{ matrix.os }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
