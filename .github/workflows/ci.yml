name: C++ Advanced CI Pipeline

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov

    - name: Configure CMake
      # We use Debug mode to ensure line numbers match for Coverage
      # We enable AddressSanitizer and Coverage flags
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="--coverage -fsanitize=address" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

    - name: Build Project
      run: cmake --build build

    - name: Run Unit Tests
      # This runs your gTest and complexity tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Generate Coverage Report
      # We use --ignore-errors mismatch to skip the gTest macro line-number confusion
      run: |
        lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps/*' --output-file coverage.info --ignore-errors mismatch
        lcov --list coverage.info

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: binary_search_release.tar.gz
        name: Release ${{ github.ref_name }}
        body: "Automated release for version ${{ github.ref_name }}. Includes optimized headers and library."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
